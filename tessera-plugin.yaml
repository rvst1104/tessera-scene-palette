id: scene_palette
version: 0.2.0
api: "0.8"
icon: palette
maintainer: rvst1104
license: MIT
stage: beta
topics: [home]
attributes: [ai-developed]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 14
permissions:
  home_assistant_actions: [scene.turn_on]
tiles:
  - id: palette
    name: tile_name
    icon: palette
    sizes: { min: 2x2, max: 3x3 }
    memory: 6000
    example: tile_example
    options:
      - { id: scene_1, kind: text, label: scene_1, hint: scene_hint, default: "" }
      - { id: scene_2, kind: text, label: scene_2, hint: scene_hint, default: "" }
      - { id: scene_3, kind: text, label: scene_3, hint: scene_hint, default: "" }
      - { id: scene_4, kind: text, label: scene_4, hint: scene_hint, default: "" }
      - { id: scene_5, kind: text, label: scene_5, hint: scene_hint, default: "" }
      - { id: scene_6, kind: text, label: scene_6, hint: scene_hint, default: "" }
      - { id: label_1, kind: text, label: label_1, hint: label_hint, default: "" }
      - { id: label_2, kind: text, label: label_2, hint: label_hint, default: "" }
      - { id: label_3, kind: text, label: label_3, hint: label_hint, default: "" }
      - { id: label_4, kind: text, label: label_4, hint: label_hint, default: "" }
      - { id: label_5, kind: text, label: label_5, hint: label_hint, default: "" }
      - { id: label_6, kind: text, label: label_6, hint: label_hint, default: "" }
