id: scene_palette
version: 0.1.0
api: "0.8"
icon: palette
maintainer: rvst1104
license: MIT
stage: beta
topics: [home]
attributes: [ai-developed]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 14
permissions:
