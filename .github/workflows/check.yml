name: Prototype checks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: Run the official screen preview as well
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TESSERA_TREE: ${{ github.workspace }}/tessera-core-upstream
      TESSERA_MANIFEST: ${{ github.workspace }}/tessera-core-upstream/screen_manager/app/plugin_manifest.py
      TESSERA_BOARDS: ${{ github.workspace }}/tessera-core-upstream/screen_manager/app/boards.json
    steps:
      - uses: actions/checkout@v4
        with:
          path: tessera-scene-palette
      - uses: actions/checkout@v4
        with:
          repository: MaxGramser/homeassistant_espscreen
          ref: 8fee7045b048fd4202579e207000e970e88fa57e
          path: tessera-core-upstream
      - uses: actions/checkout@v4
        with:
          repository: MaxGramser/tessera-plugins
          ref: 69fc733896878af01e5da20e2a4f2260c4087a4b
          path: tessera-plugins-upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install 'esphome==2026.9.1' PyYAML 'aiohttp>=3.12,<4'
      - name: Check plugin
        run: python tessera-plugins-upstream/tools/check.py tessera-scene-palette
      - name: Regression against stock Tessera manifest
        run: python tessera-scene-palette/checks/test_config.py
      - name: Test Tessera compatibility
        working-directory: tessera-core-upstream
        run: >-
          python -m unittest tests.test_plugins.Manifest tests.test_plugins.Everywhere
          tests.test_plugins.Boards tests.test_plugins.Layout tests.test_plugins.Hello
          tests.test_plugins.Sidecar -q
      - name: Test scene selection
        run: |
          g++ -std=c++20 tessera-scene-palette/checks/test_selection.cpp -o /tmp/test_selection
          /tmp/test_selection
          g++ -std=c++20 -I tessera-core-upstream -I tessera-core-upstream/tests tessera-core-upstream/tests/test_screen_input.cpp -o /tmp/test_screen_input
          /tmp/test_screen_input
      - name: Install preview system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev build-essential pkg-config
      - name: Official preview
        run: python tessera-plugins-upstream/tools/preview.py tessera-scene-palette --strict --board cyd --board guition
      - name: Save preview results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-preview
          path: tessera-scene-palette/.preview/
          include-hidden-files: true
          if-no-files-found: ignore
